mpd_replanner:
  ros__parameters:
    socket_path: /tmp/mpd-runtime.sock
    scene_id: EnvWarehouseExtraObjectsV00
    seed: 123
    worker_timeout_s: 1.5
    plan_rate_hz: 1.0
    planning_budget_s: 0.8
    commit_margin_s: 0.1
    max_state_age_s: 0.25
    plan_only: true
    jtc_action_name: /franka_arm_jtc/follow_joint_trajectory
    command_lead_s: 0.05
    prefix_dt_s: 0.05
    max_start_drift_rad: 0.10
    max_handoff_speed_rad_s: 0.20
    max_q_jump_rad: 0.03
    max_dq_jump_rad_s: 0.20
    max_ddq_jump_rad_s2: 2.0
    joint_state_topic: /franka/joint_states
    planned_trajectory_topic: ~/planned_trajectory
    # No implicit production motion. Publish ~/pose_target or ~/joint_target.
    # replan_fake_hardware.launch.py injects its own Warehouse smoke target.
