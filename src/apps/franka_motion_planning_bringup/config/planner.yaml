motion_planner:
  ros__parameters:
    target_link_name: fr3_link8
    robot_description_node: robot_state_publisher
    source_name: motion_planner
    source_namespace: /action_sources
    command_sink_mode: em
    pose_topic: /teleop/pose_franka
    output_joint_names: "fr3_joint1,fr3_joint2,fr3_joint3,fr3_joint4,fr3_joint5,fr3_joint6,fr3_joint7"
    load_meshes: false
    plan_rate_hz: 50.0
    max_state_age_s: 0.1
    pose_stale_timeout_s: 0.5
    method: jparse
    gamma: 0.3
    # Validated with impedance+Ruckig (2026-07-26). Same numbers reflexed on limiter+EMA.
    position_gain: 15.0
    orientation_gain: 3.0
    nullspace_gain: 0.05
    max_joint_velocity: 2.5
    dls_damping: 0.05
    max_iterations_per_tick: 4
    # max_joint_velocity / plan_rate_hz (2.5 / 50)
    max_step_rad: 0.05
    position_tolerance_m: 1.0e-3
    orientation_tolerance_rad: 1.0e-2
