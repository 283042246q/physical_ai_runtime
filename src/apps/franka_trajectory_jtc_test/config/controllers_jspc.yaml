# Joint GUI → EM joint_target → JointSpaceImpedanceController (Ruckig).
# Stiffness matches franka_motion_planning_bringup; Ruckig limits softened
# for joint-GUI A/B feel (v/a/j = 1.2 / 4.0 / 55).
controller_manager:
  ros__parameters:
    update_rate: 1000
    thread_priority: 98
    overruns:
      manage: false
      print_warnings: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
      state_interfaces: [robot_state]
    franka_arm_jspc:
      type: manipulation_position_controllers/JointSpaceImpedanceController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100.0

franka_robot_state_broadcaster:
  ros__parameters:
    convenience_publish_rate: 100

franka_arm_jspc:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    input_topic: /franka_arm_jspc/joint_reference

    # Validated teleop stiffness; Ruckig one notch softer than FCI-near defaults.
    kp_stiffness: [1000.0, 1000.0, 1000.0, 1000.0, 500.0, 320.0, 150.0]
    kd_damping: [25.0, 25.0, 25.0, 25.0, 12.0, 10.0, 5.0]
    max_torques: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]
    velocity_filter_alpha: 0.99

    reference_behavior:
      mode: ruckig
      max_points: 1
      stale_timeout_s: 0.5
      max_velocity_rad_s: 1.2
      max_acceleration_rad_s2: 4.0
      max_jerk_rad_s3: 55.0
      ruckig_control_cycle_s: 0.001
      ema_alpha: 0.95
    lower_limits: [-2.9007, -1.8361, -2.9007, -3.0770, -2.8763, 0.4398, -3.0508]
    upper_limits: [2.9007, 1.8361, 2.9007, -0.1169, 2.8763, 4.6216, 3.0508]
    allow_partial_joint_references: false
    reject_out_of_bounds_targets: true
    robot_time_interface: fr3/robot_time
