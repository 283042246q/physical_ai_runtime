# Pair with joint_gui_rt_bringup JSPC args (controllers_jspc + franka_arm_jspc).
joint_target_gui:
  ros__parameters:
    joint_state_topic: /franka/joint_states
    output_contract: joint_target
    goal_topic: /action_sources/joint_gui/joint_target
    publish_rate_hz: 20.0
    use_gui: true
    sync_on_start: true
    auto_send: false
    auto_send_rate_hz: 10.0
    auto_send_mode: stream
    auto_send_joint_index: 3
    auto_send_amplitude_rad: 0.10
    auto_send_period_s: 4.0
